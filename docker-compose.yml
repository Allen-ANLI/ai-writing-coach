services:
  db:
    image: pgvector/pgvector:pg17
    container_name: awc-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_writing_coach}
      POSTGRES_USER: ${POSTGRES_USER:-awc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-awc_local_dev}
    ports:
      # Loopback only: never expose PostgreSQL to other network interfaces.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/10-enable-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-awc} -d ${POSTGRES_DB:-ai_writing_coach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  languagetool:
    # erikvl87 builds are broken (:latest has 0-byte jars, :6.6 ships Java 11
    # for Java-17 classes); meyay is a maintained minimal image (port 8081).
    image: meyay/languagetool:latest
    container_name: awc-languagetool
    ports:
      # Loopback only: the grammar service is internal infrastructure.
      - "127.0.0.1:${LANGUAGE_TOOL_PORT:-8010}:8081"
    healthcheck:
      # The meyay image is minimal: wget exists, curl does not.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/v2/languages || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  pgdata:
