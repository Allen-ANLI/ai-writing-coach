      tags:
      - Writing Sessions
      summary: Get session
      responses:
        '200':
          description: Session detail
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
      - Writing Sessions
      summary: Update allowed session fields
      responses:
        '200':
          description: Success
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
