openapi: 3.1.0
info:
  title: AI Writing Coach API
  version: 1.7.0
  description: Final API contract aligned with Database ERD V1.2. Working documents use server_revision; immutable
    snapshots use version_no. Refresh tokens are HttpOnly cookies. 1.1.1 adds the additive
    infrastructure endpoint GET /health (200 database reachable, 503 database unavailable);
    no approved business endpoint semantics were changed. 1.2.0 (user decisions 2026-11-15)
    adds POST /essays/{essay_id}/issues/{issue_id}/accept (atomic acceptance of a stored
    correction) and essays.question_prompt (separate non-editable question section);
    additive only, no existing semantics changed. 1.3.0 (Slice 10, reconciliation R8)
    adds the commercialization surface (plans, subscription, sandbox checkout/confirm,
    cancel, billing history, quota usage); payment provider runs in sandbox mode only
    until real activation is explicitly approved; additive only. 1.4.0 (Slice 11,
    reconciliations R7/R9) adds password reset (request/confirm) and account
    deletion/export; additive only. 1.5.0 (ADR-024, user decisions 2026-11-15) adds the
    conversational planner (POST /essays/{essay_id}/planner/chat, GET
    /essays/{essay_id}/planner/messages); outline confirmation now archives earlier
    confirmed versions (one current plan per essay); additive only. 1.6.0 (ADR-025)
    adds POST /essays/{essay_id}/planner/progress (ghost-guidance fulfillment
    judgment) and preferences.ghost_hints_enabled; grammar checks gain a
    whole-sentence LLM scan (behavioral, same endpoint); additive only. 1.7.0
    (ADR-026) adds POST /essays/{essay_id}/expressions/polish-sentence and GET
    /essays/{essay_id}/expression-suggestions; teaching responses become
    structured v2 (knowledge_point first, then sentence_reason); suggestion
    items gain nullable start/end offsets; additive only.
servers:
- url: https://api.example.com/api/v1
  description: Production placeholder
- url: http://localhost:8000/api/v1
  description: Local development
security:
- bearerAuth: []
tags:
- name: Auth
- name: Users
- name: Essays
- name: Writing Sessions
- name: Grammar
- name: Teaching
- name: Expressions
- name: Learning
- name: IELTS
- name: Evaluations
- name: Outlines
- name: Workflows
- name: Analytics
- name: Billing
- name: Health
  description: Infrastructure health check. Not a product feature endpoint.
paths:
  /health:
    get:
      tags:
      - Health
      summary: Infrastructure health check
      description: 'Reports service liveness and real PostgreSQL connectivity. Returns
        200 only when the database is reachable; returns 503 when it is not. Public
        operational endpoint: no authentication required. Added as an additive infrastructure
        endpoint; no approved business endpoint semantics were changed.'
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy and the database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is up but the database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register and create device session
      responses:
        '201':
          description: Registered; refresh cookie set
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '409':
          description: Email is already registered (error code RESOURCE_ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 10
                  writeOnly: true
                display_name:
                  type:
                  - string
                  - 'null'
              required:
              - email
              - password
      security: []
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login and create device session
      responses:
        '200':
          description: Authenticated; refresh cookie set
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  writeOnly: true
              required:
              - email
              - password
      security: []
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate refresh token in same device session
      responses:
        '200':
          description: New access token and rotated cookie
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      parameters:
      - name: refresh_token
        in: cookie
        required: false
        schema:
          type: string
      security: []
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke current device session
      responses:
        '204':
          description: Session revoked
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
  /auth/logout-all:
    post:
      tags:
      - Auth
      summary: Revoke all user sessions
      responses:
        '200':
          description: All sessions revoked
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
  /auth/sessions:
    get:
      tags:
      - Auth
      summary: List stable device sessions
      responses:
        '200':
          description: Device sessions
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
  /auth/sessions/{session_id}:
    delete:
      tags:
      - Auth
      summary: Revoke device session
      responses:
        '204':
          description: Session revoked
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
  /users/me:
    get:
      tags:
      - Users
      summary: Get current user
      responses:
        '200':
          description: Success
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
    patch:
      tags:
      - Users
      summary: Update current user
      responses:
        '200':
          description: Success
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema: &id001
              type: object
              properties: {}
              additionalProperties: true
    delete:
      tags:
      - Users
      summary: Delete own account and all owned data (irreversible)
      responses:
        '204':
          description: Account deleted
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
  /users/me/preferences:
    get:
      tags:
      - Users
      summary: Get preferences
      responses:
        '200':
          description: Success
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
    patch:
      tags:
      - Users
      summary: Patch preferences
      responses:
        '200':
          description: Success
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /essays:
    post:
      tags:
      - Essays
      summary: Create Essay, Working Document and Original Snapshot atomically
      responses:
        '201':
          description: Created
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type:
                  - string
                  - 'null'
                writing_type:
                  type: string
                  enum:
                  - free_writing
                  - ielts_task1
                  - ielts_task2
                  - other
                question_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                question_prompt:
                  type:
                  - string
                  - 'null'
                  maxLength: 5000
                  description: Added 1.2.0 — question text shown in a separate non-editable
                    editor section; never part of the essay document.
              required:
              - writing_type
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    get:
      tags:
      - Essays
      summary: List current user's essays
      responses:
        '200':
          description: Cursor-paginated list
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /essays/{essay_id}:
    get:
      tags:
      - Essays
      summary: Get essay metadata
      responses:
        '200':
          description: Metadata
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      parameters:
      - name: essay_id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
      - Essays
      summary: Update essay metadata
      responses:
        '200':
          description: Updated
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
      parameters:
      - name: essay_id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
      - Essays
      summary: Soft-delete essay
      responses:
        '204':
          description: Soft-deleted
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      parameters:
      - name: essay_id
        in: path
        required: true
        schema:
          type: string
  /essays/{essay_id}/working-document:
    get:
      tags:
      - Essays
      summary: Get current Working Document
      responses:
        '200':
          description: Working Document
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      parameters:
      - name: essay_id
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
      - Essays
      summary: Autosave Working Document; no snapshot
      responses:
        '200':
          description: Saved; 409 on revision conflict
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema: &id002
              type: object
              properties:
                base_revision:
                  type: integer
                  minimum: 1
                client_revision:
                  type: integer
                  minimum: 0
                content_json:
                  type: object
                plain_text:
                  type: string
                word_count:
                  type: integer
                  minimum: 0
              required:
              - base_revision
              - client_revision
              - content_json
      parameters:
      - name: essay_id
        in: path
        required: true
        schema:
          type: string
  /essays/{essay_id}/snapshots:
    post:
      tags:
      - Essays
      summary: Create snapshot and archive only matching-revision Issues
      responses:
        '201':
          description: Snapshot created
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema: &id007
              type: object
              properties:
                source_revision:
                  type: integer
                version_type:
                  type: string
                  enum:
                  - original
                  - checkpoint
                  - assisted
                  - ai_rewrite
                  - final
                label:
                  type:
                  - string
                  - 'null'
              required:
              - source_revision
              - version_type
      parameters:
      - name: essay_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
  /essays/{essay_id}/versions:
    get:
      tags:
      - Essays
      summary: List immutable versions
      responses:
        '200':
          description: Version list
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      parameters:
      - name: essay_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /essays/{essay_id}/versions/{version_id}:
    get:
      tags:
      - Essays
      summary: Get immutable version
      responses:
        '200':
          description: Version detail
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      parameters:
      - name: essay_id
        in: path
        required: true
        schema:
          type: string
      - name: version_id
        in: path
        required: true
        schema:
          type: string
  /essays/{essay_id}/restore:
    post:
      tags:
      - Essays
      summary: Restore snapshot into Working Document
      responses:
        '200':
          description: Restored; 409 on conflict
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version_id:
                  type: string
                  format: uuid
                base_revision:
                  type: integer
              required:
              - version_id
              - base_revision
      parameters:
      - name: essay_id
        in: path
        required: true
        schema:
          type: string
  /essays/{essay_id}/sessions:
    post:
      tags:
      - Writing Sessions
      summary: Start assisted or independent session
      responses:
        '201':
          description: Session created; feature flags server-derived
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - assisted
                  - independent
                activity_type:
                  type: string
                  enum:
                  - free_writing
                  - practice
                  - mock_exam
                exam_config:
                  type:
                  - object
                  - 'null'
                  additionalProperties: true
              required:
              - mode
              - activity_type
      parameters:
      - name: essay_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
      - Writing Sessions
      summary: List sessions
      responses:
        '200':
          description: Session list
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Request validation error
        '429':
          description: Rate limit exceeded
      parameters:
      - name: essay_id
        in: path
        required: true
        schema:
          type: string
  /writing-sessions/{session_id}:
