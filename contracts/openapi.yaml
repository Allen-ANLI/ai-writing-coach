  /essays/{essay_id}/expressions/polish-sentence:
    post:
      tags:
      - Expressions
      summary: Fragment-level sentence polish (ADR-026)
      description: >-
        Scan a completed sentence for unnatural fragments (empty when natural),
        or fetch three more options for one fragment via fragment_anchor +
        exclude. Items carry absolute codepoint offsets of the fragment they
        replace; acceptance reuses the existing accept endpoint.
      responses:
        '200':
          description: Fragments with replacement options (may be empty)
        '401':
          description: Authentication required or token invalid
        '403':
          description: Forbidden (independent mode)
        '404':
          description: Resource not found
        '409':
          description: Stale revision
        '422':
          description: Request validation error
        '429':
          description: Rate limit or AI quota exceeded
      requestBody:
        required: true
