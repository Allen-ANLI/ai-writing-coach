      - name: essay_id
        in: path
        required: true
        schema:
          type: string
      - name: issue_id
        in: path
        required: true
        schema:
          type: string
  /essays/{essay_id}/issues/validate:
    post:
      tags:
      - Grammar
      summary: Atomically save edited document, validate Issue, update state and record event
      responses:
        '200':
          description: Validation outcome; 409 means no partial write
        '401':
          description: Authentication required or token invalid
        '403':
