components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      description: Success envelope for the infrastructure health check.
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              const: ok
            database:
              type: string
              enum:
              - connected
          required:
          - status
          - database
        meta:
          type: object
          properties:
            request_id:
              type: string
      required:
      - data
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  reason:
                    type: string
          required:
          - code
          - message
        meta:
          type: object
          properties:
            request_id:
              type: string
      required:
      - error
    TextRange:
      type: object
      properties:
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 1
        offset_unit:
          type: string
          const: unicode_codepoint
      required:
      - start
      - end
      - offset_unit
    WorkingDocumentUpdate: *id002
    WorkingDocumentSaved:
      type: object
      properties:
        data:
          type: object
          properties:
            essay_id:
              type: string
              format: uuid
            server_revision:
              type: integer
            client_revision:
              type: integer
            saved:
              type: boolean
            saved_at:
              type: string
              format: date-time
      required:
      - data
    GrammarIssue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        sub_category:
          type:
          - string
          - 'null'
        source:
          type: string
          enum:
          - rule_engine
          - llm
          - hybrid
        source_server_revision:
          type: integer
        essay_version_id:
          type:
          - string
          - 'null'
          format: uuid
        start_offset:
          type: integer
        end_offset:
          type: integer
        offset_unit:
          type: string
          const: unicode_codepoint
        anchor_text:
          type: string
        short_explanation:
          type:
          - string
          - 'null'
        suggestions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              display_text:
                type: string
              answer_revealed:
                type: boolean
                const: false
        status:
          type: string
          enum:
          - detected
          - resolved
          - ignored
          - stale
    GrammarCheckResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            server_revision:
              type: integer
            client_revision:
              type: integer
            check_status:
              type: string
              enum:
              - completed
              - partial
            issues:
              type: array
              items:
                $ref: '#/components/schemas/GrammarIssue'
      required:
      - data
    IssueValidationRequest: *id003
    IssueAcceptRequest:
      type: object
      description: Added 1.2.0. Accepts a stored correction; suggestion_id defaults to the
        recommended suggestion when omitted. Replacement text is server-stored only.
      properties:
        base_revision:
          type: integer
          minimum: 1
        client_revision:
          type: integer
          minimum: 0
        suggestion_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - base_revision
      - client_revision
    TeachingRequest: *id004
    EvaluationCreate: *id005
    RewriteAccept: *id006
    SnapshotCreate: *id007
    GenericObject: *id001
    IssueValidationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            issue_id:
              type: string
              format: uuid
            validation_status:
              type: string
              enum:
              - correct
              - incorrect
              - needs_review
            is_resolved:
              type: boolean
            server_revision:
              type: integer
      required:
      - data
    TeachingResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            teaching_id:
              type: string
              format: uuid
            issue_id:
              type: string
              format: uuid
            source_server_revision:
              type: integer
            title:
              type: string
            why_wrong:
              type: string
            grammar_rule:
              type: string
            recommended_correction:
              type: string
            personalized_note:
              type:
              - string
              - 'null'
      required:
      - data
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: NotFound
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: ValidationError
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
