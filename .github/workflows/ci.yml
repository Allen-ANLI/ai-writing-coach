name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ai_writing_coach
          POSTGRES_USER: awc
          POSTGRES_PASSWORD: awc_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awc -d ai_writing_coach"
          --health-interval 5s --health-timeout 5s --health-retries 10
      languagetool:
        image: meyay/languagetool:latest
        ports:
          - 8010:8081
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8081/v2/languages || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 40s
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://awc:awc_local_dev@127.0.0.1:5432/ai_writing_coach
      LANGUAGE_TOOL_URL: http://127.0.0.1:8010
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      JWT_SECRET: ci-only-secret-not-for-production-use-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Lint
        run: |
          ruff check app tests alembic
          ruff format --check app tests alembic
      - name: Test
        run: pytest -q
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint src e2e
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      # Production dependencies must be clean. Dev-only advisories (lint
      # toolchain) are tracked in docs/SECURITY_REVIEW.md as accepted risk.
      - name: Dependency audit (production)
        run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ai_writing_coach
          POSTGRES_USER: awc
          POSTGRES_PASSWORD: awc_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awc -d ai_writing_coach"
          --health-interval 5s --health-timeout 5s --health-retries 10
      languagetool:
        image: meyay/languagetool:latest
        ports:
          - 8010:8081
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8081/v2/languages || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 40s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -e .[dev]
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
          DATABASE_URL: postgresql+psycopg://awc:awc_local_dev@127.0.0.1:5432/ai_writing_coach
          LANGUAGE_TOOL_URL: http://127.0.0.1:8010
        run: npx playwright test

  # Build-only verification of the production images (no registry push, no
  # deployment). The dev machine cannot reach Docker Hub, so CI is where the
  # Dockerfiles are exercised.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t awc-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t awc-frontend:ci ./frontend
