# AI Writing Coach — production-style compose stack.
# Usage:
#   cp .env.production.example .env   # fill in real secrets (never commit)
#   docker compose -f docker-compose.prod.yml up -d --build
# Only nginx is exposed; db/languagetool/backend/frontend stay internal.
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_writing_coach}
      POSTGRES_USER: ${POSTGRES_USER:-awc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/10-enable-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-awc} -d ${POSTGRES_DB:-ai_writing_coach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  languagetool:
    image: meyay/languagetool:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/v2/languages || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-awc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_writing_coach}
      LANGUAGE_TOOL_URL: http://languagetool:8081
    depends_on:
      db:
        condition: service_healthy
      languagetool:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
